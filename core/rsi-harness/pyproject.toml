[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hms-rsi-harness"
version = "0.1.0"
description = "Memory-backend-neutral runtime contracts for recursive self-improvement harnesses"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["rsi_harness", "rsi_harness.datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
