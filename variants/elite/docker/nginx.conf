events {}

http {
    server {
        listen 8080;
        # No multipart upload route exists on this service; 32m is generous.
        client_max_body_size 32m;
        # A variable proxy_pass target requires an explicit resolver. 127.0.0.11
        # is Docker's embedded DNS. A literal `proxy_pass http://hms-elite:8000`
        # would instead resolve once at startup and cache the IP forever, so the
        # vhost would 502 after the app container is recreated with a new IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hms_app http://hms-elite:8000;

        # FastAPI registers /docs, /redoc and /openapi.json on the app itself,
        # while the Bearer dependency sits on the APIRouter (server/app.py:1013).
        # Those three paths therefore bypass authentication entirely and must be
        # blocked here. The app port is not published either; this is the second
        # of two layers, and the one that survives someone adding `ports:` later.
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        # Polled every 10s by the compose healthcheck; keep it out of the log.
        location = /health {
            proxy_pass $hms_app;
            access_log off;
        }

        # A variable target with no URI part passes the original request URI
        # through unchanged (no path rewriting).
        location / {
            proxy_pass $hms_app;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $http_request_id;
        }
    }
}
